<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERMINAL</title>
<style>
:root{
  --bg:#000000; --bg1:#0b0c0e; --bg2:#121418; --bg3:#1a1d23;
  --line:#2a2f38; --line2:#3a414d;
  --fg:#d8dee9; --fg2:#8b96a8; --fg3:#5d6675;
  --amber:#ff9e1b; --amber2:#ffc46b;
  --amber-dim:#8a5a10;
  --up:#22d07a; --down:#ff4d4d; --flat:#8b96a8;
  --blue:#4aa3ff; --violet:#b48cff; --cyan:#3fd8d8;
  --mono:'Consolas','Cascadia Mono','SF Mono','Menlo','DejaVu Sans Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--mono);
  font-size:12px; line-height:1.35; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg1)}
::-webkit-scrollbar-thumb:hover{background:var(--amber-dim)}

.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
/* Tages-P&L-Raster: divergierend, gruen/grau/rot aus den Theme-Tokens.
   Jede Zelle traegt ihre Zahl, Farbe ist also nie die einzige Information. */
.daygrid{display:grid;grid-template-columns:repeat(7,30px);grid-auto-rows:30px;gap:2px;padding:6px 10px 8px;
  justify-content:start}
.dayhdr{display:grid;grid-template-columns:repeat(7,30px);gap:2px;padding:4px 10px 0;
  justify-content:start;
  font-size:9px;letter-spacing:.8px;color:var(--fg3)}
.dayhdr span{text-align:center}
.daycell{height:100%;min-height:0;padding:0;border-radius:3px;border:1px solid var(--line);
  background:var(--bg2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;position:relative;cursor:default;overflow:hidden}
.daycell .dnum{font-size:7px;color:var(--fg3);line-height:1;opacity:.8}
.daycell .dval{font-size:9px;font-weight:600;line-height:1.1;letter-spacing:-.3px}
.daycell.noday{opacity:.35}
.daycell:hover{border-color:var(--line2)}
.dayleg{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--fg3);
  padding:0 10px 8px}
.dayleg i{width:14px;height:10px;border-radius:2px;display:inline-block;
  border:1px solid var(--line)}
.amber{color:var(--amber)} .dim{color:var(--fg2)} .dim2{color:var(--fg3)}
.mono{font-family:var(--mono)}
.r{text-align:right} .c{text-align:center}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Layout ---------- */
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
#top{background:var(--bg1);border-bottom:1px solid var(--line);flex:0 0 auto}
#brand{display:flex;align-items:center;gap:10px;padding:5px 10px;border-bottom:1px solid var(--line)}
#logo{color:#000;background:var(--amber);font-weight:700;letter-spacing:2px;padding:2px 8px;font-size:12px}
#clock{margin-left:auto;color:var(--fg2);font-size:11px;display:flex;gap:14px;align-items:center}
#status-dot{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block;
  box-shadow:0 0 6px var(--up)}
#status-dot.bad{background:var(--down);box-shadow:0 0 6px var(--down)}
#status-dot.warn{background:var(--amber);box-shadow:0 0 6px var(--amber)}

/* Ticker tape */
#tape{height:22px;overflow:hidden;background:#000;border-bottom:1px solid var(--line);position:relative}
#tape-inner{display:flex;gap:26px;white-space:nowrap;position:absolute;left:0;top:0;
  height:22px;align-items:center;padding-left:8px;will-change:transform}
.tick{font-size:11px;letter-spacing:.3px}
.tick b{color:var(--fg);font-weight:600}

/* Command line */
#cmdbar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--bg2);
  border-bottom:1px solid var(--line)}
#prompt{color:var(--amber);font-weight:700}
#cmd{flex:1;background:transparent;border:none;outline:none;color:var(--amber);
  font-family:var(--mono);font-size:13px;letter-spacing:.5px;caret-color:var(--amber)}
#cmd::placeholder{color:var(--fg3)}
#go{background:var(--amber);color:#000;border:none;padding:2px 10px;font-family:var(--mono);
  font-weight:700;cursor:pointer;font-size:11px}
#go:hover{background:#ffb84d}
#suggest{position:absolute;z-index:60;background:var(--bg2);border:1px solid var(--line2);
  max-height:280px;overflow:auto;min-width:380px;display:none;box-shadow:0 8px 24px #000c}
#suggest div{padding:4px 10px;cursor:pointer;display:flex;gap:10px;font-size:11px}
#suggest div:hover,#suggest div.sel{background:var(--amber);color:#000}
#suggest div:hover *,#suggest div.sel *{color:#000 !important}

/* Function keys */
#fkeys{display:flex;background:var(--bg1);border-bottom:1px solid var(--line);overflow-x:auto}
.fk{padding:4px 12px;border-right:1px solid var(--line);cursor:pointer;color:var(--fg2);
  font-size:11px;white-space:nowrap;user-select:none}
.fk:hover{background:var(--bg3);color:var(--fg)}
.fk.on{background:var(--amber);color:#000;font-weight:700}
.fk i{font-style:normal;color:var(--amber);margin-right:5px}
.fk.on i{color:#000}

/* Main */
#main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:6px}
.view.on{display:block}

/* Panels */
.grid{display:grid;gap:6px;height:100%}
.panel{background:var(--bg1);border:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;min-width:0;overflow:hidden}
.phead{background:var(--bg3);padding:3px 8px;font-size:10px;letter-spacing:1.2px;
  color:var(--amber);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:8px;flex:0 0 auto;text-transform:uppercase}
.phead .sub{color:var(--fg3);letter-spacing:0;text-transform:none;font-size:10px}
.phead .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.pbody{flex:1;overflow:auto;min-height:0}
/* several stacked in one panel: size to content instead of sharing the space */
.pbody.fit{flex:0 0 auto;min-height:0}
.pbody.pad{padding:8px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{position:sticky;top:0;background:var(--bg2);color:var(--fg2);font-weight:600;
  text-align:left;padding:3px 7px;border-bottom:1px solid var(--line2);white-space:nowrap;
  font-size:10px;letter-spacing:.4px;z-index:2;cursor:pointer;user-select:none}
thead th:hover{color:var(--amber)}
thead th.sorted{color:var(--amber)}
thead th.r{width:1%}
tbody td{max-width:340px}
tbody td{padding:2px 7px;border-bottom:1px solid #15181d;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:#1b1f26}
tbody tr.sel{background:#2a2410;box-shadow:inset 2px 0 0 var(--amber)}
td.sym{color:var(--amber);font-weight:600}
.flash-up{animation:fu .7s ease-out} .flash-down{animation:fd .7s ease-out}
@keyframes fu{0%{background:#0d5c33}100%{background:transparent}}
@keyframes fd{0%{background:#6b1414}100%{background:transparent}}

/* Buttons / inputs */
button,select,input[type=text],input[type=number]{font-family:var(--mono);font-size:11px}
.btn{background:var(--bg3);color:var(--fg);border:1px solid var(--line2);padding:2px 9px;
  cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn.on{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
.btn.sm{padding:1px 6px;font-size:10px}
.btn.danger:hover{border-color:var(--down);color:var(--down)}
.btn.off{opacity:.34;border-style:dashed}
.btn.off:hover{opacity:.85;border-color:var(--amber);color:var(--amber);border-style:solid}
#vwarn{display:none;background:#3a1d05;border-bottom:1px solid var(--amber);
  color:var(--amber);padding:4px 10px;font-size:11px;letter-spacing:.3px}
#vwarn.on{display:block}
input[type=text],input[type=number],select{background:#000;border:1px solid var(--line2);
  color:var(--fg);padding:2px 6px;outline:none}
input:focus,select:focus{border-color:var(--amber)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:1px;background:var(--line)}
.kpi{background:var(--bg1);padding:5px 8px}
.kpi .k{color:var(--fg3);font-size:9.5px;letter-spacing:.6px;text-transform:uppercase}
.kpi .v{font-size:14px;margin-top:1px}
.bigquote{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:8px 10px;
  border-bottom:1px solid var(--line);background:var(--bg1)}
.bigquote .s{font-size:20px;color:var(--amber);font-weight:700;letter-spacing:1px}
.bigquote .n{color:var(--fg2);font-size:12px}
.bigquote .p{font-size:24px;font-weight:600}
.bigquote .ch{font-size:14px}
.badge{font-size:9.5px;padding:1px 6px;border:1px solid var(--line2);color:var(--fg2);
  letter-spacing:.5px}
.badge.live{border-color:var(--up);color:var(--up)}
.badge.closed{border-color:var(--fg3);color:var(--fg3)}
.badge.demo{border-color:var(--violet);color:var(--violet)}

/* Charts */
.chartwrap{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%}
#tt{position:absolute;pointer-events:none;background:#000e;border:1px solid var(--line2);
  padding:5px 8px;font-size:10.5px;display:none;z-index:20;white-space:pre;line-height:1.5}

/* News */
.news{display:flex;flex-direction:column}
.nitem{padding:5px 9px;border-bottom:1px solid #15181d;cursor:pointer;display:flex;gap:8px}
.nitem:hover{background:#1b1f26}
.nbar{width:3px;flex:0 0 3px;background:var(--fg3)}
.nitem .t{font-size:11.5px;line-height:1.4}
.nitem .m{color:var(--fg3);font-size:10px;margin-top:2px;display:flex;gap:8px}
.sent{font-size:10px;padding:0 4px;border:1px solid currentColor}

/* Heat */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:2px;padding:4px}
.hcell{padding:5px 6px;border:1px solid #0006;min-height:46px;display:flex;
  flex-direction:column;justify-content:space-between;cursor:pointer}
.hcell:hover{outline:1px solid var(--amber)}
.hcell .s{font-size:10.5px;font-weight:700}
.hcell .p{font-size:12px;font-weight:600}

/* misc */
.empty{padding:24px;text-align:center;color:var(--fg3);font-size:11px}
.err{padding:8px 10px;color:var(--down);font-size:11px;border-left:2px solid var(--down);
  background:#1a0d0d;margin:6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.bar{height:6px;background:var(--bg3);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);display:block}
hr.sep{border:none;border-top:1px solid var(--line);margin:8px 0}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:11px}
dl.kv dt{color:var(--fg3)}
dl.kv dd{text-align:right}
#toast{position:fixed;right:12px;bottom:12px;z-index:200;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--bg2);border:1px solid var(--amber);border-left:3px solid var(--amber);
  padding:7px 12px;font-size:11px;max-width:340px;box-shadow:0 6px 20px #000c;animation:slide .25s}
.toast.bad{border-color:var(--down);border-left-color:var(--down)}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.ctools{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:4px 8px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto}
.ctools .lbl{color:var(--fg3);font-size:9px;letter-spacing:1.1px;margin:0 4px 0 10px}
.ctools .lbl:first-child{margin-left:0}
.ctools .sepv{color:var(--line2);margin:0 2px}
.phead{flex-wrap:wrap}
#rtbadge{display:none;color:var(--up);font-size:10px;letter-spacing:.6px}
#rtbadge.on{display:inline}
.badge.rt{border-color:var(--up);color:var(--up)}
.blink{animation:bl 1.1s step-end infinite}
@keyframes bl{50%{opacity:0}}

/* ==========================================================================
   Handy / schmale Bildschirme.
   Das Grundlayout ist ein Desktop-Raster mit festen Spaltenbreiten, die per
   inline-style aus dem JS kommen — deshalb hier !important: Inline-Styles
   schlagen sonst jede Regel. Ab hier wird aus dem Raster eine Spalte.
   ========================================================================== */
@media (max-width: 820px){
  html,body{height:auto}
  #app{height:auto;min-height:100dvh}

  /* Ansichten sind absolut positioniert und dürfen am Handy nicht clippen */
  #main{overflow:visible;position:static;flex:none}
  .view{position:static;inset:auto;overflow:visible;padding:4px}

  /* aus dem Mehrspalter wird ein Stapel */
  .grid{
    grid-template-columns:1fr !important;
    grid-template-rows:none !important;
    grid-auto-rows:min-content;
    height:auto !important;
    gap:8px;
  }
  .grid>*{grid-row:auto !important; grid-column:auto !important;}

  .panel{height:auto}
  /* Panels mit Tabellen bekommen eine sinnvolle Höhe statt flex-Rest */
  .pbody{max-height:60vh; overflow:auto; -webkit-overflow-scrolling:touch}
  /* breite Tabellen scrollen in sich, statt die Seite breit zu machen */
  .pbody>table{min-width:480px}

  /* Positions- und Historientabellen haben 10-11 Spalten. Seitlich scrollen
     ist am Handy unbrauchbar, also wird jede Zeile zu einer Karte: Bezeichnung
     links, Wert rechts. Die Kopfzeile entfaellt, sie steht jetzt in den Zellen. */
  .pbody>table.cardtbl{min-width:0}
  .cardtbl thead{display:none}
  .cardtbl tbody,.cardtbl tr,.cardtbl td{display:block}
  .cardtbl tr{
    border:1px solid var(--line); border-radius:4px;
    padding:6px 8px; margin:0 0 6px; background:var(--bg2);
  }
  .cardtbl td{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; padding:2px 0; border:0; text-align:right;
  }
  .cardtbl td::before{
    content:attr(data-l); flex:none;
    color:var(--fg3); font-size:9px; letter-spacing:.6px; text-align:left;
  }
  /* Symbol als Kartenkopf, ohne Beschriftung */
  .cardtbl td.sym{
    display:block; text-align:left; font-size:13px;
    border-bottom:1px solid var(--line); padding-bottom:4px; margin-bottom:4px;
  }
  .cardtbl td.sym::before{display:none}
  /* Schliessen-Knopf ueber die volle Breite */
  .cardtbl td.act{display:block; text-align:right; padding-top:6px}
  .cardtbl td.act::before{display:none}
  .cardtbl td.act .btn{width:100%}
  /* leere Zellen ohne Beschriftung nicht als Geisterzeile zeigen */
  .cardtbl td:empty{display:none}

  /* Panel-Kopf: Knopfreihen (MAIN/MAKRO/DAX/…) liefen rechts aus dem Bild */
  .phead{flex-wrap:wrap; row-gap:4px}
  .phead .right{
    flex-wrap:wrap; display:flex; gap:4px;
    max-width:100%; margin-left:0;
  }

  /* Charts haben am Handy keine Resthöhe, also feste Höhe */
  .chartwrap{flex:none; height:240px; min-height:240px}
  canvas{max-width:100%}

  /* Kopfzeile darf umbrechen */
  #brand{flex-wrap:wrap; height:auto; row-gap:2px}
  #clock{flex-wrap:wrap}
  #t-ny{display:none}

  /* Eingabezeile und Funktionstasten: größere Ziele für Finger */
  #cmdbar input{font-size:16px}      /* unter 16px zoomt iOS/Chrome beim Tippen */
  #fkeys{scrollbar-width:none}
  #fkeys::-webkit-scrollbar{display:none}
  #fkeys>*{padding:10px 12px; font-size:11px; white-space:nowrap}
  .btn{min-height:32px; padding:5px 10px}
  .btn.sm{min-height:28px}

  /* Tabellen minimal größer, sonst unlesbar */
  table{font-size:12px}
  th,td{padding:5px 6px}

  /* Kennzahlen zweispaltig */
  .kpis{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}

  /* Tagesgitter: am Handy nur die letzten 4 Wochen, sonst scrollt man an acht
     Zeilen leerer Quadrate vorbei, bevor die Positionen kommen. 28 ist ein
     Vielfaches von 7, die Montags-Ausrichtung bleibt also erhalten. */
  .daygrid,.dayhdr{justify-content:center}
  .daycell:not(:nth-last-child(-n+28)){display:none}

  /* Eingabefelder im Positions-Formular untereinander */
  #view-PORT input[type=text]{min-width:0; width:100%}
}

@media (max-width: 420px){
  .kpis{grid-template-columns:1fr 1fr}
  #logo{font-size:12px}
  .pbody>table{min-width:440px}
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="brand">
      <span id="logo">TERMINAL</span>
      <span class="dim2" style="font-size:10px">MARKET DATA &amp; ANALYTICS</span>
      <span id="modebadge"></span>
      <div id="clock">
        <span id="rtbadge">● ECHTZEIT KRYPTO</span>
        <span id="latency" class="dim2"></span>
        <span><span id="status-dot"></span> <span id="statustext">VERBINDE</span></span>
        <span id="t-local"></span>
        <span id="t-ny" class="dim2"></span>
      </div>
    </div>
    <div id="tape"><div id="tape-inner"></div></div>
    <div id="cmdbar">
      <span id="prompt">&gt;</span>
      <input id="cmd" autocomplete="off" spellcheck="false"
        placeholder="Symbol oder Kommando eingeben  —  z.B.  AAPL   ·   SAP.DE GP   ·   BTC-USD   ·   SCR   ·   PORT   ·   HELP">
      <button id="go" title="Enter">GO</button>
    </div>
    <div id="suggest"></div>
    <div id="vwarn"></div>
    <div id="fkeys"></div>
  </div>
  <div id="main"></div>
</div>
<div id="toast"></div>
<div id="tt"></div>
<script>
"use strict";
const UI_VERSION="1.4";
/* ==========================================================================
   TERMINAL — Frontend
   ========================================================================== */

/* ---------- Hilfsfunktionen ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c;
  if(h!==undefined)e.innerHTML=h; return e;};
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const nf = (v,d=2)=> (v===null||v===undefined||isNaN(v)) ? "—"
  : Number(v).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=2)=> (v===null||v===undefined||isNaN(v)) ? "—"
  : (v>0?"+":"")+Number(v).toFixed(d)+"%";
const sgn = (v,d=2)=> (v===null||v===undefined||isNaN(v)) ? "—"
  : (v>0?"+":"")+nf(v,d);
function big(v){
  if(v===null||v===undefined||isNaN(v)) return "—";
  const a=Math.abs(v);
  if(a>=1e12) return (v/1e12).toFixed(2)+" T";
  if(a>=1e9)  return (v/1e9 ).toFixed(2)+" Mrd";
  if(a>=1e6)  return (v/1e6 ).toFixed(2)+" Mio";
  if(a>=1e3)  return (v/1e3 ).toFixed(1)+" Tsd";
  return nf(v,0);
}
function px(v,cur){
  if(v===null||v===undefined||isNaN(v)) return "—";
  const a=Math.abs(v);
  const d = a>=1000?2 : a>=10?2 : a>=1?3 : a>=0.01?4 : 6;
  return nf(v,d)+(cur?" "+cur:"");
}
const cls = v => (v>0?"up":v<0?"down":"flat");
const arrow = v => v>0?"▲":v<0?"▼":"■";
function ago(ts){
  if(!ts) return "";
  const s=Math.max(0,Date.now()/1000-ts);
  if(s<60) return Math.floor(s)+"s";
  if(s<3600) return Math.floor(s/60)+"min";
  if(s<86400) return Math.floor(s/3600)+"h";
  return Math.floor(s/86400)+"d";
}
function spanText(sec){
  if(!sec) return "—";
  if(sec<3600) return Math.round(sec/60)+" MIN";
  if(sec<86400) return (sec/3600).toFixed(1).replace(".",",")+" STD";
  return Math.round(sec/86400)+" TAGE";
}
const dstr = ts => ts? new Date(ts*1000).toLocaleDateString("de-DE",
  {day:"2-digit",month:"2-digit",year:"2-digit"}) : "—";
const dtstr = ts => ts? new Date(ts*1000).toLocaleString("de-DE",
  {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";

/* ---------- API ---------- */
let LAT = 0;
async function api(path, opts){
  const t0=performance.now();
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts||{}));
  LAT = Math.round(performance.now()-t0);
  $("#latency").textContent = LAT+" ms";
  let j;
  try{ j = await r.json(); }catch(e){ throw new Error("Ungültige Antwort vom Server"); }
  if(!r.ok || j.ok===false) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}
const post = (p,b)=>api(p,{method:"POST",body:JSON.stringify(b||{})});

/* ---------- Zustand ---------- */
const S = {
  sym:"AAPL", range:"1y", interval:null, view:"MON",
  chartType:"candle", overlays:{sma20:true,sma50:true,sma200:false,bb:false},
  sub:"vol",
  wl:"MAIN", state:null, cfg:null,
  quotes:{}, prev:{}, chart:null, profile:null, news:[], marketNews:[],
  screen:{rows:[],set:"equities",fund:false,sortKey:"changePct",sortDir:-1,filter:""},
  port:null, tapeSyms:[], tapeLabel:{}, names:{}, busy:false, lastErr:null
};

/* ---------- Toast ---------- */
function toast(msg, bad){
  const t = el("div","toast"+(bad?" bad":""), esc(msg));
  $("#toast").appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .4s";t.style.opacity=0;
    setTimeout(()=>t.remove(),400);}, bad?9000:5000);
}
function setStatus(kind,text){
  const d=$("#status-dot"); d.className = kind==="ok"?"":kind;
  $("#statustext").textContent = text;
}

/* ---------- Uhr ---------- */
function tickClock(){
  const now=new Date();
  $("#t-local").textContent = now.toLocaleTimeString("de-DE");
  $("#t-ny").textContent = "NY "+now.toLocaleTimeString("de-DE",{timeZone:"America/New_York"});
}
setInterval(tickClock,1000); tickClock();

/* ---------- Ticker-Band ---------- */
let tapeX=0, tapeW=0;
function symName(s){
  // Readable name for any ticker: server map first, then the tape's own label,
  // then a stripped-down version of the raw ticker.
  return (S.names && S.names[s]) || (S.tapeLabel && S.tapeLabel[s])
         || s.replace("=X","").replace("^","");
}
function tapeName(s){ return symName(s); }
function tapeCell(q){
  return `<span class="${cls(q.changePct)}">${px(q.price)} ${arrow(q.changePct)} ${pct(q.changePct)}</span>`;
}
function renderTape(){
  const inner=$("#tape-inner");
  const syms=S.tapeSyms;
  if(!syms.length) return;
  const make=()=> syms.map(s=>
    `<span class="tick" data-sym="${esc(s)}"><b>${esc(tapeName(s))}</b> `+
    `<span data-tv="${esc(s)}">${tapeCell(S.quotes[s]||{})}</span></span>`).join("");
  inner.innerHTML = make()+make();
  tapeW = inner.scrollWidth/2;
}
function animTape(){
  const inner=$("#tape-inner");
  if(tapeW>0){ tapeX -= 0.45; if(-tapeX>=tapeW) tapeX=0;
    inner.style.transform="translateX("+tapeX+"px)"; }
  requestAnimationFrame(animTape);
}
requestAnimationFrame(animTape);
$("#tape").addEventListener("click",e=>{
  const t=e.target.closest(".tick"); if(t) go(t.dataset.sym);
});

/* ==========================================================================
   Chart-Engine (Canvas)
   ========================================================================== */
const COL = {
  bg:"#0b0c0e", grid:"#1c2027", axis:"#5d6675", text:"#8b96a8",
  up:"#22d07a", down:"#ff4d4d", upFill:"#22d07a", downFill:"#ff4d4d",
  amber:"#ff9e1b", blue:"#4aa3ff", violet:"#b48cff", cyan:"#3fd8d8",
  line:"#d8dee9", cross:"#ffffff55"
};

class Chart {
  constructor(canvas, tooltip){
    this.cv=canvas; this.tt=tooltip; this.ctx=canvas.getContext("2d");
    this.data=null; this.tech=null; this.opts={};
    this.hover=-1; this.dpr=1;
    this.win=null;      // sichtbarer Indexbereich, null = alles
    this.yMan=null;     // manuelle Preisskala, null = automatisch
    this.drag=null;
    canvas.style.cursor="crosshair";
    canvas.addEventListener("mousemove", e=>this.onMove(e));
    canvas.addEventListener("mouseleave", ()=>{this.hover=-1;this.drag=null;
      canvas.style.cursor="crosshair";this.hideTT();this.draw();});
    canvas.addEventListener("wheel", e=>this.onWheel(e), {passive:false});
    canvas.addEventListener("mousedown", e=>this.onDown(e));
    window.addEventListener("mouseup", ()=>{ if(this.drag){ this.drag=null;
      canvas.style.cursor="crosshair"; } });
    canvas.addEventListener("dblclick", ()=>this.resetView());
    this._ro = new ResizeObserver(()=>this.draw());
    this._ro.observe(canvas.parentElement);
  }
  destroy(){ try{this._ro.disconnect();}catch(e){} }
  set(data,tech,opts){ this.data=data; this.tech=tech||{}; this.opts=opts||{}; this.draw(); }
  hideTT(){ if(this.tt) this.tt.style.display="none"; }

  layout(){
    const dpr=window.devicePixelRatio||1; this.dpr=dpr;
    const w=this.cv.parentElement.clientWidth, h=this.cv.parentElement.clientHeight;
    if(this.cv.width!==Math.floor(w*dpr)||this.cv.height!==Math.floor(h*dpr)){
      this.cv.width=Math.floor(w*dpr); this.cv.height=Math.floor(h*dpr);
    }
    this.cv.style.width=w+"px"; this.cv.style.height=h+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.W=w; this.H=h;
    this.padL=6; this.padR=62; this.padT=8; this.padB=20;
    const subH = this.opts.sub && this.opts.sub!=="none" ? Math.max(52, Math.min(120, h*0.24)) : 0;
    this.subH=subH;
    this.priceTop=this.padT;
    this.priceBot=h-this.padB-(subH? subH+8 : 0);
    this.subTop=this.priceBot+8; this.subBot=h-this.padB;
    this.plotW=w-this.padL-this.padR;
  }

  visible(){
    const d=this.data; if(!d||!d.c.length) return null;
    const N=d.c.length;
    let from=0, to=N;
    if(this.win){
      from=Math.max(0, Math.min(N-3, Math.round(this.win.from)));
      to  =Math.max(from+3, Math.min(N, Math.round(this.win.to)));
    }
    return {from:from, to:to, n:(to-from)};
  }
  isZoomed(){ return !!(this.win || this.yMan); }
  resetView(){ this.win=null; this.yMan=null; this.sync(); this.draw(); }
  sync(){ CHART_VIEW.win=this.win; CHART_VIEW.yMan=this.yMan; updateAutoBtn(); }

  scales(){
    const d=this.data, v=this.visible(); if(!v) return null;
    let lo=Infinity, hi=-Infinity;
    for(let i=v.from;i<v.to;i++){
      const l = this.opts.type==="line" ? d.c[i] : d.l[i];
      const h = this.opts.type==="line" ? d.c[i] : d.h[i];
      if(l<lo) lo=l; if(h>hi) hi=h;
    }
    const ov=this.overlaySeries();
    ov.forEach(s=>{ for(let i=v.from;i<v.to;i++){ const y=s.data[i];
      if(y!=null){ if(y<lo)lo=y; if(y>hi)hi=y; } } });
    // Vortagesschluss nur in die Skala zwingen, wenn er nahe genug liegt -
    // sonst wird ein Sekundenchart zur flachen Linie zusammengedrueckt.
    if(this.opts.prevClose!=null && this.opts.showPrev){
      const p=this.opts.prevClose, band=(hi-lo)||1;
      if(p>=lo-band*0.5 && p<=hi+band*0.5){
        lo=Math.min(lo,p); hi=Math.max(hi,p);
      }
    }
    if(!isFinite(lo)||!isFinite(hi)){lo=0;hi=1;}
    const padv=(hi-lo)*0.06||Math.abs(lo)*0.001||1; lo-=padv; hi+=padv;
    if(this.yMan){ lo=this.yMan.lo; hi=this.yMan.hi; }
    this.lo=lo; this.hi=hi; this.v=v;
    this.bw = this.plotW/v.n;
    return true;
  }
  X(i){ return this.padL + (i-this.v.from+0.5)*this.bw; }
  Y(p){ return this.priceBot - (p-this.lo)/(this.hi-this.lo)*(this.priceBot-this.priceTop); }
  iAt(x){ return Math.round((x-this.padL)/this.bw-0.5)+this.v.from; }

  overlaySeries(){
    const t=this.tech||{}, o=this.opts.overlays||{}, out=[];
    if(o.sma20 && t.sma20) out.push({data:t.sma20,color:COL.amber,label:"SMA20",w:1.2});
    if(o.sma50 && t.sma50) out.push({data:t.sma50,color:COL.blue,label:"SMA50",w:1.2});
    if(o.sma200&& t.sma200)out.push({data:t.sma200,color:COL.violet,label:"SMA200",w:1.2});
    if(o.bb && t.bbUpper){
      out.push({data:t.bbUpper,color:"#3fd8d888",label:"BB+",w:1});
      out.push({data:t.bbLower,color:"#3fd8d888",label:"BB-",w:1});
      out.push({data:t.bbMid,color:"#3fd8d844",label:"BB",w:1,dash:[3,3]});
    }
    return out;
  }

  niceTicks(lo,hi,count){
    const span=hi-lo; if(span<=0) return [lo];
    const raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw)));
    const norm=raw/mag;
    const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
    const out=[]; let v=Math.ceil(lo/step)*step;
    while(v<=hi){ out.push(v); v+=step; }
    return out;
  }

  draw(){
    if(!this.data||!this.data.c||!this.data.c.length){ this.blank(); return; }
    this.layout(); if(!this.scales()){ this.blank(); return; }
    const c=this.ctx, d=this.data, v=this.v;
    c.clearRect(0,0,this.W,this.H);
    c.fillStyle=COL.bg; c.fillRect(0,0,this.W,this.H);

    /* --- Gitter + Preisachse --- */
    const ticks=this.niceTicks(this.lo,this.hi,Math.max(3,Math.floor((this.priceBot-this.priceTop)/44)));
    c.font="10px "+getComputedStyle(document.body).fontFamily;
    c.textBaseline="middle";
    ticks.forEach(t=>{
      const y=this.Y(t);
      c.strokeStyle=COL.grid; c.lineWidth=1;
      c.beginPath(); c.moveTo(this.padL,Math.round(y)+0.5); c.lineTo(this.W-this.padR,Math.round(y)+0.5); c.stroke();
      c.fillStyle=COL.text; c.textAlign="left";
      c.fillText(this.fmtP(t), this.W-this.padR+5, y);
    });

    /* --- Zeitachse --- */
    this.drawTimeAxis();

    /* --- Vorheriger Schluss --- */
    if(this.opts.showPrev && this.opts.prevClose!=null
       && this.opts.prevClose>=this.lo && this.opts.prevClose<=this.hi){
      const y=this.Y(this.opts.prevClose);
      c.save(); c.setLineDash([4,4]); c.strokeStyle="#8b96a888"; c.lineWidth=1;
      c.beginPath(); c.moveTo(this.padL,y); c.lineTo(this.W-this.padR,y); c.stroke(); c.restore();
    }

    /* --- Kursdarstellung --- */
    if(this.opts.type==="line"||this.opts.type==="area"){
      const grad=c.createLinearGradient(0,this.priceTop,0,this.priceBot);
      const upTrend = d.c[v.to-1] >= d.c[v.from];
      const base = upTrend?COL.up:COL.down;
      c.beginPath();
      for(let i=v.from;i<v.to;i++){ const x=this.X(i),y=this.Y(d.c[i]);
        i===v.from?c.moveTo(x,y):c.lineTo(x,y); }
      if(this.opts.type==="area"){
        c.save();
        c.lineTo(this.X(v.to-1),this.priceBot); c.lineTo(this.X(v.from),this.priceBot); c.closePath();
        grad.addColorStop(0,base+"44"); grad.addColorStop(1,base+"00");
        c.fillStyle=grad; c.fill(); c.restore();
        c.beginPath();
        for(let i=v.from;i<v.to;i++){ const x=this.X(i),y=this.Y(d.c[i]);
          i===v.from?c.moveTo(x,y):c.lineTo(x,y); }
      }
      c.strokeStyle=base; c.lineWidth=1.6; c.stroke();
    } else {
      const bw=Math.max(1,Math.min(this.bw*0.68,14));
      for(let i=v.from;i<v.to;i++){
        const up=d.c[i]>=d.o[i], col=up?COL.up:COL.down;
        const x=this.X(i);
        c.strokeStyle=col; c.lineWidth=1;
        c.beginPath(); c.moveTo(Math.round(x)+0.5,this.Y(d.h[i]));
        c.lineTo(Math.round(x)+0.5,this.Y(d.l[i])); c.stroke();
        const yo=this.Y(d.o[i]), yc=this.Y(d.c[i]);
        const top=Math.min(yo,yc), hgt=Math.max(1,Math.abs(yc-yo));
        if(this.bw<2.2){ continue; }
        c.fillStyle=up?col:col; c.globalAlpha=up?0.9:1;
        c.fillRect(Math.round(x-bw/2), Math.round(top), Math.round(bw), Math.round(hgt));
        c.globalAlpha=1;
      }
    }

    /* --- Overlays --- */
    this.overlaySeries().forEach(s=>{
      c.save(); if(s.dash)c.setLineDash(s.dash);
      c.strokeStyle=s.color; c.lineWidth=s.w||1.2; c.beginPath();
      let started=false;
      for(let i=v.from;i<v.to;i++){
        const y=s.data[i]; if(y==null){started=false;continue;}
        const x=this.X(i), yy=this.Y(y);
        if(!started){c.moveTo(x,yy);started=true;} else c.lineTo(x,yy);
      }
      c.stroke(); c.restore();
    });

    /* --- Letzter Preis --- */
    const last=d.c[v.to-1], ly=this.Y(last);
    const lcol = this.opts.prevClose!=null ? (last>=this.opts.prevClose?COL.up:COL.down) : COL.amber;
    c.fillStyle=lcol; c.fillRect(this.W-this.padR, ly-8, this.padR, 16);
    c.fillStyle="#000"; c.textAlign="left"; c.font="bold 10px "+getComputedStyle(document.body).fontFamily;
    c.fillText(this.fmtP(last), this.W-this.padR+4, ly);
    c.save(); c.setLineDash([2,3]); c.strokeStyle=lcol+"99"; c.beginPath();
    c.moveTo(this.padL,ly); c.lineTo(this.W-this.padR,ly); c.stroke(); c.restore();

    /* --- Legende --- */
    this.drawLegend();

    /* --- Unterpanel --- */
    if(this.subH) this.drawSub();

    /* --- Fadenkreuz --- */
    if(this.hover>=v.from && this.hover<v.to) this.drawCross();
  }

  fmtP(v){
    const a=Math.abs(v);
    const dd = a>=1000?0 : a>=100?1 : a>=1?2 : a>=0.01?4:6;
    return Number(v).toLocaleString("de-DE",{minimumFractionDigits:dd,maximumFractionDigits:dd});
  }

  drawTimeAxis(){
    const c=this.ctx,d=this.data,v=this.v;
    const intraday=(d.t[1]-d.t[0])<86000;
    const target=Math.max(2,Math.floor(this.plotW/90));
    const step=Math.max(1,Math.floor(v.n/target));
    c.font="10px "+getComputedStyle(document.body).fontFamily;
    c.fillStyle=COL.text; c.textAlign="center"; c.textBaseline="top";
    let lastLabel="";
    for(let i=v.from;i<v.to;i+=step){
      const x=this.X(i); if(x<this.padL+14||x>this.W-this.padR-14) continue;
      const dt=new Date(d.t[i]*1000);
      let lab = intraday
        ? dt.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})
        : (v.n>400 ? dt.toLocaleDateString("de-DE",{month:"short",year:"2-digit"})
                   : dt.toLocaleDateString("de-DE",{day:"2-digit",month:"short"}));
      if(lab===lastLabel) continue; lastLabel=lab;
      c.strokeStyle=COL.grid; c.beginPath();
      c.moveTo(Math.round(x)+0.5,this.priceTop); c.lineTo(Math.round(x)+0.5,this.subH?this.subBot:this.priceBot);
      c.stroke();
      c.fillStyle=COL.text; c.fillText(lab,x,this.H-this.padB+4);
    }
  }

  drawLegend(){
    const c=this.ctx; const items=this.overlaySeries();
    if(!items.length) return;
    c.font="10px "+getComputedStyle(document.body).fontFamily;
    c.textAlign="left"; c.textBaseline="top";
    let x=this.padL+4;
    items.forEach(s=>{
      if(s.label==="BB") return;
      c.fillStyle=s.color; c.fillRect(x,this.padT+3,8,2);
      c.fillStyle=COL.text; c.fillText(s.label,x+11,this.padT);
      x += c.measureText(s.label).width+24;
    });
  }

  drawSub(){
    const c=this.ctx,d=this.data,v=this.v,t=this.tech||{};
    const H=this.subBot-this.subTop;
    c.strokeStyle=COL.grid; c.beginPath();
    c.moveTo(this.padL,Math.round(this.subTop)+0.5); c.lineTo(this.W-this.padR,Math.round(this.subTop)+0.5); c.stroke();
    c.font="10px "+getComputedStyle(document.body).fontFamily;
    c.textBaseline="top"; c.textAlign="left";

    if(this.opts.sub==="vol"){
      let mx=0; for(let i=v.from;i<v.to;i++) mx=Math.max(mx,d.v[i]||0);
      if(!mx) mx=1;
      const bw=Math.max(1,Math.min(this.bw*0.68,14));
      for(let i=v.from;i<v.to;i++){
        const h=(d.v[i]||0)/mx*(H-4);
        c.fillStyle = (d.c[i]>=d.o[i]?COL.up:COL.down)+"77";
        c.fillRect(Math.round(this.X(i)-bw/2), this.subBot-h, Math.round(bw), h);
      }
      c.fillStyle=COL.text; c.fillText("VOLUMEN",this.padL+4,this.subTop+3);
      c.textAlign="left"; c.fillStyle=COL.text;
      c.fillText(big(mx),this.W-this.padR+5,this.subTop+3);
    }
    else if(this.opts.sub==="rsi" && t.rsi){
      [30,50,70].forEach(lv=>{
        const y=this.subBot-(lv/100)*H;
        c.save(); c.setLineDash(lv===50?[2,4]:[3,3]);
        c.strokeStyle=lv===50?"#5d667544":"#5d667588"; c.beginPath();
        c.moveTo(this.padL,y); c.lineTo(this.W-this.padR,y); c.stroke(); c.restore();
        c.fillStyle=COL.text; c.fillText(String(lv),this.W-this.padR+5,y-5);
      });
      c.strokeStyle=COL.violet; c.lineWidth=1.3; c.beginPath();
      let st=false;
      for(let i=v.from;i<v.to;i++){ const r=t.rsi[i]; if(r==null){st=false;continue;}
        const x=this.X(i), y=this.subBot-(r/100)*H;
        if(!st){c.moveTo(x,y);st=true;} else c.lineTo(x,y); }
      c.stroke();
      c.fillStyle=COL.text; c.fillText("RSI(14)",this.padL+4,this.subTop+3);
    }
    else if(this.opts.sub==="macd" && t.macd){
      let mx=0;
      for(let i=v.from;i<v.to;i++){
        [t.macd[i],t.macdSignal[i],t.macdHist[i]].forEach(x=>{if(x!=null)mx=Math.max(mx,Math.abs(x));});
      }
      if(!mx)mx=1;
      const mid=this.subTop+H/2, sc=(H/2-4)/mx;
      c.strokeStyle="#5d667544"; c.beginPath();
      c.moveTo(this.padL,mid); c.lineTo(this.W-this.padR,mid); c.stroke();
      const bw=Math.max(1,Math.min(this.bw*0.6,10));
      for(let i=v.from;i<v.to;i++){ const h=t.macdHist[i]; if(h==null)continue;
        c.fillStyle=(h>=0?COL.up:COL.down)+"66";
        c.fillRect(Math.round(this.X(i)-bw/2), h>=0?mid-h*sc:mid, Math.round(bw), Math.abs(h*sc)); }
      [["macd",COL.amber],["macdSignal",COL.blue]].forEach(([k,col])=>{
        c.strokeStyle=col; c.lineWidth=1.2; c.beginPath(); let st=false;
        for(let i=v.from;i<v.to;i++){ const y=t[k][i]; if(y==null){st=false;continue;}
          const x=this.X(i), yy=mid-y*sc;
          if(!st){c.moveTo(x,yy);st=true;} else c.lineTo(x,yy); }
        c.stroke();
      });
      c.fillStyle=COL.text; c.fillText("MACD(12,26,9)",this.padL+4,this.subTop+3);
    }
  }

  drawCross(){
    const c=this.ctx,i=this.hover,d=this.data;
    const x=this.X(i);
    c.save(); c.setLineDash([3,3]); c.strokeStyle=COL.cross; c.lineWidth=1;
    c.beginPath(); c.moveTo(Math.round(x)+0.5,this.priceTop);
    c.lineTo(Math.round(x)+0.5,this.subH?this.subBot:this.priceBot); c.stroke();
    if(this._my!=null && this._my>=this.priceTop && this._my<=this.priceBot){
      c.beginPath(); c.moveTo(this.padL,Math.round(this._my)+0.5);
      c.lineTo(this.W-this.padR,Math.round(this._my)+0.5); c.stroke();
      c.restore();
      const p=this.lo+(this.priceBot-this._my)/(this.priceBot-this.priceTop)*(this.hi-this.lo);
      c.fillStyle="#2a2f38"; c.fillRect(this.W-this.padR,this._my-8,this.padR,16);
      c.fillStyle="#fff"; c.font="10px "+getComputedStyle(document.body).fontFamily;
      c.textAlign="left"; c.textBaseline="middle";
      c.fillText(this.fmtP(p),this.W-this.padR+4,this._my);
    } else c.restore();
  }

  onWheel(e){
    if(!this.data||!this.v) return;
    e.preventDefault();
    const r=this.cv.getBoundingClientRect();
    const mx=e.clientX-r.left;
    const N=this.data.c.length, v=this.v;
    if(mx>this.W-this.padR){
      const f=e.deltaY>0?1.15:1/1.15;
      const mid=(this.lo+this.hi)/2, half=(this.hi-this.lo)/2*f;
      this.yMan={lo:mid-half, hi:mid+half};
    } else {
      const f=e.deltaY>0?1.18:1/1.18;
      const span=v.to-v.from;
      const anchor=v.from+Math.max(0,Math.min(1,(mx-this.padL)/this.plotW))*span;
      const ns=Math.max(15, Math.min(N, span*f));
      let from=anchor-(anchor-v.from)*(ns/span);
      let to=from+ns;
      if(from<0){ to-=from; from=0; }
      if(to>N){ from-=(to-N); to=N; }
      from=Math.max(0,from);
      this.win=(from<=0.5 && to>=N-0.5) ? null : {from:from,to:to};
    }
    this.sync(); this.draw();
  }

  onDown(e){
    if(!this.data||!this.v) return;
    const r=this.cv.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const onAxis = mx>this.W-this.padR;
    this.drag={x:mx, y:my, axis:onAxis?"y":"x",
               from:this.v.from, to:this.v.to, lo:this.lo, hi:this.hi};
    this.cv.style.cursor = onAxis?"ns-resize":"grabbing";
    e.preventDefault();
  }

  onDrag(mx,my){
    const d=this.drag, N=this.data.c.length;
    if(d.axis==="y"){
      const dy=(my-d.y)/Math.max(40,(this.priceBot-this.priceTop));
      const f=Math.max(0.1, Math.min(10, 1+dy*2.2));
      const mid=(d.lo+d.hi)/2, half=(d.hi-d.lo)/2*f;
      this.yMan={lo:mid-half, hi:mid+half};
    } else {
      const span=d.to-d.from;
      const bw=this.plotW/span;
      let shift=-(mx-d.x)/bw;
      let from=d.from+shift, to=d.to+shift;
      if(from<0){ to-=from; from=0; }
      if(to>N){ from-=(to-N); to=N; }
      from=Math.max(0,from);
      this.win=(from<=0.5 && to>=N-0.5) ? null : {from:from,to:to};
    }
    this.sync(); this.draw();
  }

  onMove(e){
    if(!this.data||!this.v) return;
    const r=this.cv.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    if(this.drag){ this.onDrag(mx,my); this.hideTT(); return; }
    this.cv.style.cursor = (mx>this.W-this.padR)?"ns-resize":"crosshair";
    this._my=my;
    let i=this.iAt(mx);
    i=Math.max(this.v.from,Math.min(this.v.to-1,i));
    this.hover=i; this.draw();
    const d=this.data,t=this.tech||{};
    const dt=new Date(d.t[i]*1000);
    const intraday=(d.t[1]-d.t[0])<86000;
    const chg = i>0 ? (d.c[i]/d.c[i-1]-1)*100 : 0;
    let s = (intraday? dt.toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})
                     : dt.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"short",year:"numeric"}))+"\n"
      + "O "+this.fmtP(d.o[i])+"   H "+this.fmtP(d.h[i])+"\n"
      + "L "+this.fmtP(d.l[i])+"   C "+this.fmtP(d.c[i])+"\n"
      + "Δ "+(chg>0?"+":"")+chg.toFixed(2)+"%   Vol "+big(d.v[i]);
    if(t.rsi && t.rsi[i]!=null) s += "\nRSI "+t.rsi[i].toFixed(1);
    if(t.sma50 && t.sma50[i]!=null) s += "   SMA50 "+this.fmtP(t.sma50[i]);
    if(this.tt){
      this.tt.textContent=s; this.tt.style.display="block";
      const box=this.tt.getBoundingClientRect();
      let lx=mx+14, ly=my+14;
      if(lx+box.width>this.W) lx=mx-box.width-14;
      if(ly+box.height>this.H) ly=this.H-box.height-4;
      this.tt.style.left=lx+"px"; this.tt.style.top=Math.max(2,ly)+"px";
    }
  }

  blank(){
    this.layout(); const c=this.ctx;
    c.clearRect(0,0,this.W,this.H);
    c.fillStyle=COL.bg; c.fillRect(0,0,this.W,this.H);
    c.fillStyle=COL.text; c.font="11px "+getComputedStyle(document.body).fontFamily;
    c.textAlign="center"; c.textBaseline="middle";
    c.fillText("KEINE DATEN", this.W/2, this.H/2);
  }
}

/* Mini-Sparkline */
function spark(canvas, vals, color){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth||70, h=canvas.clientHeight||18;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const c=canvas.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  if(!vals||vals.length<2) return;
  let lo=Math.min(...vals), hi=Math.max(...vals); if(hi===lo){hi=lo+1;}
  c.beginPath();
  vals.forEach((v,i)=>{ const x=i/(vals.length-1)*(w-2)+1, y=h-2-(v-lo)/(hi-lo)*(h-4);
    i?c.lineTo(x,y):c.moveTo(x,y); });
  c.strokeStyle=color||(vals[vals.length-1]>=vals[0]?COL.up:COL.down);
  c.lineWidth=1.2; c.stroke();
}

  "1y":"1J","2y":"2J","5y":"5J","max":"MAX"};
const IV_LABEL={"1s":"1sek","5s":"5sek","15s":"15sek","30s":"30sek",
  "1m":"1min","2m":"2min","5m":"5min","15m":"15min","30m":"30min",
  "1h":"1Std","1d":"1Tag","1wk":"1Wo","1mo":"1Mon"};
const SEC_IV={"1s":1,"5s":5,"15s":15,"30s":30};
const ALL_IV=["1s","5s","15s","30s","1m","2m","5m","15m","30m","1h","1d","1wk","1mo"];
const IV_MAXDAYS={"1m":7,"2m":60,"5m":60,"15m":60,"30m":60,"1h":730,
  "1d":1e9,"1wk":1e9,"1mo":1e9};
const RANGE_DAYS_JS={"1d":1,"5d":5,"1m":31,"3m":93,"6m":186,"ytd":366,
  "1y":366,"2y":731,"5y":1827,"max":1e9};
const isCrypto = sym => /^[A-Z0-9]{2,10}-(USD|USDT|EUR)$/.test((sym||"").toUpperCase());

/* Groesster Zeitraum, der dieses Intervall noch zulaesst */
function bestRangeFor(iv){
  const mx=IV_MAXDAYS[iv]; if(!mx) return "1d";
  let best="1d";
  Object.keys(RANGE_DAYS_JS).forEach(r=>{
    if(RANGE_DAYS_JS[r]<=mx && RANGE_DAYS_JS[r]>=RANGE_DAYS_JS[best]) best=r;
  });
  return best;
}
/* Klick auf ein gerade nicht moegliches Intervall: Zeitraum passend mitziehen */
function pickInterval(iv, possible){
  if(possible){ S.interval=iv; loadChart(true); return; }
  if(SEC_IV[iv]){
    if(!isCrypto(S.sym)){
      toast("Sekundenkerzen gibt es nur bei Krypto — z.B. BTC-USD oder ETH-USD. "+
            "Börsen geben Tickdaten für Aktien nicht kostenlos heraus.", true);
      return;
    }
    S.range="1d"; S.interval=iv; loadChart(true); return;
  }
  const r=bestRangeFor(iv);
  S.range=r; S.interval=iv;
  toast("Zeitraum automatisch auf "+(RANGE_LABEL[r]||r)+" gestellt — feiner geht "+
        (IV_LABEL[iv]||iv)+" bei dieser Datenquelle nicht.");
  loadChart(true);
}

/* Preise fuer die Bot-Tabellen: FX und Krypto brauchen mehr Nachkommastellen
   als px(), das fuer Aktien ausgelegt ist (1-10 -> nur 3 Stellen). */
function bpx(v){
  if(v===null||v===undefined||isNaN(v)) return "\u2014";
  const a=Math.abs(v);
  const d = a>=1000?2 : a>=100?2 : a>=10?3 : a>=1?5 : a>=0.01?5 : 8;
  return nf(v,d);
}

function heatColor(p){
  if(p==null||isNaN(p)) return "#1a1d23";
  const x=Math.max(-4,Math.min(4,p))/4;
  if(x>=0){ const a=0.12+x*0.72; return `rgba(34,208,122,${a.toFixed(3)})`; }
  const a=0.12+(-x)*0.72; return `rgba(255,77,77,${a.toFixed(3)})`;
}
function heatBlock(title, syms){
  const cells=syms.map(s=>{
    const q=S.quotes[s];
    if(!q||q.ok===false) return `<div class="hcell" data-sym="${esc(s)}" style="background:#1a1d23">
      <div class="s dim2">${esc(s)}</div><div class="p dim2">—</div></div>`;
    return `<div class="hcell" data-sym="${esc(s)}" style="background:${heatColor(q.changePct)}">
      <div class="s">${esc((q.symbol||s).replace("=X","").replace("^",""))}</div>

      <div class="s" style="font-weight:400;opacity:.75">${px(q.price)}</div>

  return `<div class="panel"><div class="phead">${esc(title)}</div>

/* ==========================================================================

   ========================================================================== */
function currentSymbols(){
  const wls=(S.state&&S.state.watchlists)||{};
  const set=new Set([S.sym]);
  S.tapeSyms.forEach(s=>set.add(s));
  Object.values(wls).forEach(a=>a.forEach(s=>set.add(s)));
  ((S.state&&S.state.alerts)||[]).forEach(a=>set.add(a.symbol));
  ((S.port&&S.port.positions)||[]).forEach(p=>set.add(p.symbol));
  if(S.view==="HEAT" && S.cfg) Object.values(S.cfg.universe).forEach(a=>a.forEach(s=>set.add(s)));
  return Array.from(set).filter(Boolean);
}

async function pollQuotes(){
  const syms=currentSymbols();
  if(!syms.length) return;
  try{
    const r=await api("/api/quotes?symbols="+encodeURIComponent(syms.join(",")));
    let bad=0;
    r.quotes.forEach(q=>{

  a.returnPct=(a.equity-a.start)/a.start*100;

/* ==========================================================================
   Echtzeit-Ticks (Krypto)  —  Coinbase, Binance als Ausweichquelle
   ========================================================================== */
const RT = {ws:null, subs:[], pending:{}, connected:false, connecting:false,
            fails:0, provider:"coinbase", stopped:false, retryAfter:0};

function rtSymbols(){
  return currentSymbols().filter(s=>/^[A-Z0-9]{2,10}-USD$/.test(s)).slice(0,25);
}
function sameSet(a,b){
  return a.length===b.length && a.every(x=>b.includes(x));
}
function setRtBadge(on,txt){
  const b=$("#rtbadge"); if(!b) return;
  b.classList.toggle("on",!!on);
  if(txt) b.textContent=txt;
}
function rtClose(){
  RT.stopped=true;
  try{ if(RT.ws) RT.ws.close(); }catch(e){}
  RT.ws=null; RT.connected=false; setRtBadge(false);
}
function rtConnect(force){
  const syms=rtSymbols();
  if(!syms.length){ rtClose(); return; }
  if(RT.ws && RT.connected && sameSet(syms,RT.subs)) return;
  if(RT.connecting) return;
  if(!force && RT.retryAfter && Date.now()<RT.retryAfter && sameSet(syms,RT.subs)) return;
  RT.stopped=false; RT.connecting=true;
  try{ if(RT.ws) RT.ws.close(); }catch(e){}
  RT.subs=syms.slice();

  let url, onOpen, parse;
  if(RT.provider==="coinbase"){
    url="wss://ws-feed.exchange.coinbase.com";
    onOpen=ws=>ws.send(JSON.stringify({type:"subscribe",product_ids:syms,channels:["ticker"]}));
    parse=m=>(m.type==="ticker"&&m.product_id)?[m.product_id,parseFloat(m.price)]:null;
  } else {
    const streams=syms.map(s=>s.replace("-USD","").toLowerCase()+"usdt@miniTicker").join("/");
    url="wss://stream.binance.com:9443/stream?streams="+streams;
    onOpen=()=>{};
    parse=m=>{
      const d=m.data||m; if(!d || !d.s) return null;
      const sym=d.s.replace(/USDT$/,"")+"-USD";
      return [sym, parseFloat(d.c)];
    };
  }

  let ws;
  try{ ws=new WebSocket(url); }catch(e){ RT.connecting=false; return; }
  RT.ws=ws;
  const opened={v:false};

  ws.onopen=()=>{ opened.v=true; RT.connected=true; RT.connecting=false;
    RT.fails=0; RT.retryAfter=0;
    setRtBadge(true,"● ECHTZEIT "+(RT.provider==="coinbase"?"COINBASE":"BINANCE"));
    try{ onOpen(ws); }catch(e){} };

  ws.onmessage=e=>{
    let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
    const r=parse(m); if(!r) return;
    const [sym,pxv]=r;
    if(isFinite(pxv)) RT.pending[sym]=pxv;
  };

  ws.onerror=()=>{ try{ ws.close(); }catch(e){} };

  ws.onclose=()=>{
    RT.connected=false; RT.connecting=false; setRtBadge(false);
    if(RT.stopped) return;
    if(!opened.v){
      RT.fails++;
      if(RT.fails===2 && RT.provider==="coinbase"){
        RT.provider="binance"; RT.fails=0;
      } else if(RT.fails>=6){
        // Keine der Quellen erreichbar - in 5 Minuten noch einmal versuchen
        RT.fails=0; RT.provider="coinbase";
        RT.retryAfter=Date.now()+300000;
        setTimeout(()=>{ RT.retryAfter=0; rtConnect(true); }, 300000);
        return;
      }
    }
    setTimeout(()=>rtConnect(true), Math.min(20000, 1500*(RT.fails+1)));
  };
}

/* ---------- Indikatoren im Browser (fuer live wachsende Kerzen) ---------- */
function jsSma(v,n){const out=[];let s=0;for(let i=0;i<v.length;i++){s+=v[i];
  if(i>=n)s-=v[i-n];out.push(i>=n-1?s/n:null);}return out;}
function jsEma(v,n){const out=[];const k=2/(n+1);let p=null;
  for(let i=0;i<v.length;i++){p=(p===null)?v[i]:v[i]*k+p*(1-k);out.push(i>=n-1?p:null);}return out;}
function jsRsi(v,n){const out=new Array(v.length).fill(null);
  if(v.length<n+1)return out;let g=0,l=0;
  for(let i=1;i<=n;i++){const d=v[i]-v[i-1];g+=Math.max(d,0);l+=Math.max(-d,0);}
  let ag=g/n,al=l/n;out[n]=al===0?100:100-100/(1+ag/al);
  for(let i=n+1;i<v.length;i++){const d=v[i]-v[i-1];
    ag=(ag*(n-1)+Math.max(d,0))/n;al=(al*(n-1)+Math.max(-d,0))/n;
    out[i]=al===0?100:100-100/(1+ag/al);}return out;}
function jsMacd(v){const f=jsEma(v,12),sl=jsEma(v,26);
  const line=v.map((_,i)=>(f[i]!=null&&sl[i]!=null)?f[i]-sl[i]:null);
  const valid=line.filter(x=>x!=null);const sg=jsEma(valid,9);
  const signal=new Array(line.length).fill(null);let j=0;
  for(let i=0;i<line.length;i++)if(line[i]!=null)signal[i]=sg[j++];
  const hist=line.map((x,i)=>(x!=null&&signal[i]!=null)?x-signal[i]:null);
  return [line,signal,hist];}
function jsBoll(v,n,k){const mid=jsSma(v,n);
  const up=new Array(v.length).fill(null),lo=new Array(v.length).fill(null);
  for(let i=n-1;i<v.length;i++){const w=v.slice(i-n+1,i+1);const mu=w.reduce((a,b)=>a+b,0)/n;
    const sd=Math.sqrt(w.reduce((a,b)=>a+(b-mu)*(b-mu),0)/n);
    up[i]=mu+k*sd;lo[i]=mu-k*sd;}return [up,mid,lo];}
function jsAtr(h,l,c,n){const tr=c.map((_,i)=>i===0?h[0]-l[0]
  :Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));return jsEma(tr,n);}

function recalcTech(se){
  const c=se.c; if(!c||c.length<3) return {};
  const [ml,ms,mh]=jsMacd(c);
  const [bu,bm,bl]=jsBoll(c,20,2);
  const r=jsRsi(c,14), a=jsAtr(se.h,se.l,c,14);
  const s20=jsSma(c,20), s50=jsSma(c,50), s200=jsSma(c,200);
  const last=arr=>{for(let i=arr.length-1;i>=0;i--)if(arr[i]!=null)return arr[i];return null;};
  const perf=d=>c.length>d?+(((c[c.length-1]/c[c.length-1-d])-1)*100).toFixed(2):null;
  return {sma20:s20,sma50:s50,sma200:s200,rsi:r,macd:ml,macdSignal:ms,macdHist:mh,
    bbUpper:bu,bbMid:bm,bbLower:bl,atr:a,
    last:{rsi:last(r),sma20:last(s20),sma50:last(s50),sma200:last(s200),
          macd:last(ml),macdSignal:last(ms),atr:last(a)},
    perf:{d1:perf(1),w1:perf(5),m1:perf(21),m3:perf(63),m6:perf(126),y1:perf(252)}};
}

/* ---------- gezieltes DOM-Nachziehen (ohne Neuaufbau) ---------- */
function patchQuote(sym, old){
  const q=S.quotes[sym]; if(!q) return;
  const dir = (old==null)?0:(q.price>old?1:q.price<old?-1:0);

  $$(`[data-tv="${sym}"]`).forEach(n=>{ n.innerHTML=tapeCell(q); });

  $$(`tr[data-sym="${sym}"]`).forEach(tr=>{
    const p=tr.querySelector('[data-q="price"]');
    const c=tr.querySelector('[data-q="chg"]');
    const t=tr.querySelector('[data-q="pct"]');
    if(p) p.textContent=px(q.price);
    if(c){ c.textContent=sgn(q.change); c.className="r "+cls(q.change); }
    if(t){ t.textContent=arrow(q.changePct)+" "+pct(q.changePct); t.className="r "+cls(q.changePct); }
    if(dir && p){
      tr.classList.remove("flash-up","flash-down");
      void tr.offsetWidth;
      tr.classList.add(dir>0?"flash-up":"flash-down");
    }
  });

  if(sym===S.sym){
    $$(".bigquote").forEach(n=>{
      if(!n.isConnected) return;
      const t=el("div"); t.innerHTML=quoteHeader(q);
      if(t.firstElementChild) n.replaceWith(t.firstElementChild);
    });
    const se=S.chart && S.chart.series;
    if(se && se.c && se.c.length){
      const ivs=SEC_IV[S.chart.interval];
      let grew=false, added=0, removed=0;
      const oldN=se.c.length;
      if(ivs){
        // Sekundenchart: neue Kerzen entstehen live aus dem Tick-Strom
        const bucket=Math.floor(Date.now()/1000/ivs)*ivs;
        const lastT=se.t[se.t.length-1];
        if(bucket>lastT){
          const gap=Math.min(6,Math.round((bucket-lastT)/ivs));
          for(let k=1;k<=gap;k++){
            const t=lastT+k*ivs;
            const open=se.c[se.c.length-1];
            const v=(k===gap)?q.price:open;
            se.t.push(t); se.o.push(open);
            se.h.push(Math.max(open,v)); se.l.push(Math.min(open,v));
            se.c.push(v); se.v.push(0);
          }
          added=se.c.length-oldN;
          while(se.t.length>1400){["t","o","h","l","c","v"].forEach(k=>se[k].shift()); removed++;}
          grew=true;
          if(CHART_VIEW.win){
            const anchored = CHART_VIEW.win.to >= oldN-0.5;
            if(anchored){ CHART_VIEW.win.from+=added; CHART_VIEW.win.to+=added; }
            CHART_VIEW.win.from=Math.max(0,CHART_VIEW.win.from-removed);
            CHART_VIEW.win.to=Math.max(CHART_VIEW.win.from+3,CHART_VIEW.win.to-removed);
          }
        }
      }
      const i=se.c.length-1;
      se.c[i]=q.price;
      if(q.price>se.h[i]) se.h[i]=q.price;
      if(q.price<se.l[i]) se.l[i]=q.price;
      if(grew) S.chart.tech=recalcTech(se);
      [CHART,CHART2].forEach(ch=>{
        if(ch && ch.cv && ch.cv.isConnected){
          ch.tech=S.chart.tech; ch.win=CHART_VIEW.win; ch.draw();
        }
      });
    }
  }
}

const HIST=[]; let HI=-1;
const VIEW_WORDS={GP:"GP",CHART:"GP",DES:"DES",FA:"DES",N:"N",NEWS:"N",
  SCR:"SCR",SCREEN:"SCR",PORT:"PORT",P:"PORT",ALRT:"ALRT",AL:"ALRT",
  HEAT:"HEAT",HM:"HEAT",MON:"MON",M:"MON",DIAG:"DIAG",HELP:"HELP",H:"HELP"};

async function go(sym, view){
  if(!sym) return;
  sym=sym.trim();
  if(!sym) return;
  S.sym=sym;
  $("#cmd").value="";
  hideSuggest();
  if(view) setView(view); else render(S.view);
  S.chart=null; S.profile=null; S.news=[];
  await Promise.all([loadChart(), pollQuotes(), loadNews(), loadProfile()]);
}

async function runCommand(raw){
  const line=raw.trim();
  if(!line) return;
  HIST.unshift(line); HI=-1;
  const parts=line.split(/\s+/);
  const head=parts[0].toUpperCase();

  if(head==="HELP"||head==="?"){ setView("HELP"); $("#cmd").value=""; return; }
  if(head==="W"&&parts[1]){
    const w=parts[1].toUpperCase();
    if(S.state.watchlists[w]){ S.wl=w; setView("MON"); pollQuotes(); }
    else toast("Watchlist "+w+" existiert nicht.",true);
    $("#cmd").value=""; return;
  }
  if(head==="ADD"&&parts[1]){ addToWatchlist(parts[1].toUpperCase()); $("#cmd").value=""; return; }
  if(head==="DEL"&&parts[1]){ removeFromWatchlist(parts[1].toUpperCase()); $("#cmd").value=""; return; }
  if(VIEW_WORDS[head]&&parts.length===1){
    setView(VIEW_WORDS[head]); $("#cmd").value=""; return;
  }
  const view = parts[1] ? VIEW_WORDS[parts[1].toUpperCase()] : null;
  const looksLikeSymbol = /^[A-Za-z0-9.\-^=]{1,15}$/.test(parts[0]);
  if(looksLikeSymbol){
    const sym=parts[0].toUpperCase();
    await go(sym, view||undefined);
    const q=S.quotes[sym];
    if(q&&q.ok===false){
      toast("Kein Treffer für "+sym+" — suche…",true);
      showSuggestFor(parts[0]);
    }
    return;
  }
  showSuggestFor(line);
}

/* ---------- Vorschläge ---------- */
let SUG=[], SUGI=-1, sugTimer=null;
function hideSuggest(){ $("#suggest").style.display="none"; SUG=[]; SUGI=-1; }
function positionSuggest(){
  const r=$("#cmd").getBoundingClientRect();
  const s=$("#suggest");
  s.style.left=r.left+"px"; s.style.top=(r.bottom+2)+"px"; s.style.minWidth=Math.min(560,r.width)+"px";
}
async function showSuggestFor(q){
  if(!q||q.length<2){ hideSuggest(); return; }
  try{
    const r=await api("/api/search?q="+encodeURIComponent(q));
    SUG=r.results||[]; SUGI=-1;
    const s=$("#suggest");
    if(!SUG.length){ hideSuggest(); return; }
    s.innerHTML=SUG.map((x,i)=>`<div data-i="${i}">
      <span class="amber" style="width:110px;display:inline-block">${esc(x.symbol)}</span>
      <span class="nowrap" style="flex:1">${esc(x.name)}</span>
      <span class="dim2">${esc(x.type)} ${esc(x.exchange)}</span></div>`).join("");
    positionSuggest(); s.style.display="block";
    $$("#suggest div").forEach(d=>d.onclick=()=>go(SUG[+d.dataset.i].symbol));
  }catch(e){ hideSuggest(); }
}
function moveSuggest(d){
  if(!SUG.length) return false;
  SUGI = Math.max(0, Math.min(SUG.length-1, SUGI+d));
  const nodes=$$("#suggest div");
  nodes.forEach((n,i)=>n.classList.toggle("sel",i===SUGI));
  if(nodes[SUGI]) nodes[SUGI].scrollIntoView({block:"nearest"});
  return true;
}

const cmd=$("#cmd");
cmd.addEventListener("input",()=>{
  clearTimeout(sugTimer);
  const val=cmd.value.trim();
  if(val.length>=2 && !/^[A-Za-z0-9.\-^=]{1,6}$/.test(val) && !val.includes(" ")){
    sugTimer=setTimeout(()=>showSuggestFor(val),260);
  } else if(val.length>=3 && !val.includes(" ")){
    sugTimer=setTimeout(()=>showSuggestFor(val),400);
  } else hideSuggest();
});
cmd.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(SUGI>=0&&SUG[SUGI]){ go(SUG[SUGI].symbol); return; }
    runCommand(cmd.value); return;
  }
  if(e.key==="Escape"){ hideSuggest(); cmd.blur(); return; }
  if(e.key==="ArrowDown"){ e.preventDefault();
    if(SUG.length) moveSuggest(1);
    else if(HIST.length){ HI=Math.max(-1,HI-1); cmd.value=HI<0?"":HIST[HI]; } return; }
  if(e.key==="ArrowUp"){ e.preventDefault();
    if(SUG.length) moveSuggest(-1);
    else if(HIST.length){ HI=Math.min(HIST.length-1,HI+1); cmd.value=HIST[HI]; } return; }
});
$("#go").onclick=()=>runCommand(cmd.value);
document.addEventListener("click",e=>{ if(!e.target.closest("#suggest")&&e.target!==cmd) hideSuggest(); });
window.addEventListener("resize",()=>{ if($("#suggest").style.display==="block") positionSuggest(); });

/* ---------- Globale Tastatur ---------- */
document.addEventListener("keydown",e=>{
  const m=/^F(\d{1,2})$/.exec(e.key);
  if(m){ const i=parseInt(m[1],10)-1;
    if(VIEWS[i]){ e.preventDefault(); setView(VIEWS[i].id); } return; }
  if(e.target===cmd) return;
  if(e.key==="/"||e.key==="Enter"){ e.preventDefault(); cmd.focus(); cmd.select(); }
});

/* ==========================================================================
   Start
   ========================================================================== */
async function boot(){
  buildShell();
  setView("MON");
  setStatus("warn","VERBINDE");
  try{
    S.cfg=await api("/api/config");
    if(String(S.cfg.version||"")!==UI_VERSION){
      const w=$("#vwarn");
      w.className="on";
      w.innerHTML="⚠ SERVER LÄUFT NOCH IN VERSION "+esc(S.cfg.version||"?")+
        ", DIE OBERFLÄCHE IST VERSION "+UI_VERSION+
        " — bitte das schwarze Konsolenfenster schließen und terminal.py neu starten. "+
        "Bis dahin fehlen neue Funktionen.";
    }
    if(S.cfg.demo){
      $("#modebadge").innerHTML=`<span class="badge demo">DEMO-DATEN</span>`;
    }
    S.names = S.cfg.names || {};
    if(Array.isArray(S.cfg.tape) && S.cfg.tape.length){
      S.tapeSyms = S.cfg.tape.map(t=>t.s);
      S.tapeLabel = {}; S.cfg.tape.forEach(t=>{ S.tapeLabel[t.s]=t.l; });
    }else{
      // Older server without a curated tape: fall back to the raw universe.
      S.tapeSyms=[].concat(S.cfg.universe.INDEX, S.cfg.universe.FX,
        S.cfg.universe.COMMOD, S.cfg.universe.CRYPTO,
        S.cfg.universe.US_MEGA.slice(0,14), S.cfg.universe.DE.slice(0,8));
      S.tapeLabel = {};
    }
  }catch(e){
    setStatus("bad","SERVER NICHT ERREICHBAR");
    $("#main").innerHTML=`<div class="err">Der lokale Server antwortet nicht: ${esc(e.message)}</div>`;
    return;
  }
  try{ const r=await api("/api/state"); S.state=r.state; }
  catch(e){ S.state={watchlists:{MAIN:["AAPL"]},positions:[],alerts:[],settings:{refresh:15}}; }
  if(!S.state.watchlists[S.wl]) S.wl=Object.keys(S.state.watchlists)[0]||"MAIN";
  S.sym=(S.state.watchlists[S.wl]||["AAPL"])[0]||"AAPL";

  render("MON");
  await Promise.all([pollQuotes(), loadChart(), loadMarketNews(), loadNews(), loadPortfolio()]);
  loadProfile();
  render(S.view);

  const iv=Math.max(5,(S.state.settings&&S.state.settings.refresh)||20)*1000;
  setInterval(pollQuotes, iv);
  setInterval(checkAlerts, iv);
  setInterval(()=>{ if(S.view==="PORT") loadPortfolio(); }, iv);
  setInterval(()=>{
    if(!["MON","GP","DES"].includes(S.view)) return;
    if(SEC_IV[S.chart&&S.chart.interval]) return;  // laeuft live, kein Nachladen noetig
    loadChart();
  }, 60000);
  setInterval(()=>{
    if(SEC_IV[S.chart&&S.chart.interval] && !RT.connected) loadChart();
  }, 20000);
  setInterval(loadMarketNews, 300000);
  setInterval(()=>loadNews(), 300000);
  cmd.focus();
}
boot();
</script>
